services:
  traffic-app:
    build: ./app
    container_name: traffic_dashboard
  nginx:
    image: nginx:alpine
    container_name: traffic_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dashboard:/usr/share/nginx/html:ro
    depends_on:
      - traffic-app
