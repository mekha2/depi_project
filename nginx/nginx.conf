events {}
http {
    include /etc/nginx/mime.types;

    server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # web dashboard
        location / {
            try_files $uri /index.html;
        }

        # traffic data from the collector service
        location = /api/traffic {
            proxy_pass http://traffic-app:5000/;
        }
    }
}
